<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Env Console · FormusPro</title>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Primary">
    <a class="brand" href="#/overview" aria-label="FormusPro Env Console, overview">
      <img class="logo-blue" src="/brand/formuspro-logo-blue.png" alt="FormusPro" width="168" height="32">
      <img class="logo-white" src="/brand/formuspro-logo-white.png" alt="FormusPro" width="168" height="32">
      <span class="app-name">Env Console</span>
    </a>
    <a href="#/overview" data-route="overview">Overview</a>
    <a href="#/alerts" data-route="alerts">Alerts <span class="badge" id="alert-badge" hidden></span></a>
    <div class="nav-group">Solutions</div>
    <a href="#/solutions" data-route="solutions">Installed solutions</a>
    <a href="#/compare" data-route="compare">Solution compare</a>
    <a href="#/config" data-route="config">Connections &amp; variables</a>
    <div class="nav-group">Automation</div>
    <a href="#/components" data-route="components">Flows &amp; plugins</a>
    <a href="#/runs" data-route="runs">Run history</a>
    <a href="#/jobs" data-route="jobs">Background jobs</a>
    <div class="nav-group">Governance</div>
    <a href="#/audit" data-route="audit">Audit</a>
    <a href="#/security" data-route="security">Security</a>
    <a href="#/usersettings" data-route="usersettings">User settings</a>
    <a href="#/activity" data-route="activity">Activity</a>
    <div class="nav-group">Tools</div>
    <a href="#/cli" data-route="cli">CLI</a>
    <div class="side-foot">
      <div class="theme" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
        <button type="button" data-theme-choice="system">System</button>
      </div>
      <div class="who" id="who">Not connected</div>
    </div>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
</body>
</html>
