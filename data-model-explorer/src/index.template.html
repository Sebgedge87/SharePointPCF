<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Model Explorer</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --panel2:#ECF1F5; --line:#d5dee7; --line2:#e6ecf1;
  --text:#1d2b36; --muted:#4d6a82; --faint:#55707f;  /* body text neutral; faint passes AA on white and grey panels */
  --accent:#0A4873; --accent-bg:#E3ECF4; --accent-ink:#0A4873; --pink:#BB1C73;
  --edit:#7B134D; --edit-bg:#F7D4E7;
  --red:#7B134D; --red-bg:#F7D4E7; --amber:#BB1C73; --amber-bg:#fff; --blue:#0A4873; --blue-bg:#E3ECF4;
  --green:#fff; --green-bg:#0A4873; --violet:#7B134D; --violet-bg:#FBE6F1; --slate-bg:#ECF1F5;
  --shadow:0 8px 28px rgba(6,26,70,.16);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.5 Aptos,"Aptos Display","Segoe UI",Calibri,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(10,72,115,.35);text-underline-offset:2px} a:hover{text-decoration-color:currentColor}
/* severity: red for errors, amber for warnings, grey for info (pink stays the brand and edit colour) */
.sev-err{background:#FEE4E2;color:#B42318;font-weight:600} .sev-warn{background:#FEF0C7;color:#93370D;box-shadow:inset 0 0 0 1px #F5C26B} .sev-info{background:var(--slate-bg);color:var(--muted)}
.lnk{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(10,72,115,.35);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid tbody tr:focus-visible td{background:var(--accent-bg)} .grid tbody tr{outline:none}
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:var(--sbw,272px) 1fr;height:100vh;height:100dvh}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--panel);border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;min-width:0;flex:0 1 auto}
.top{overflow-x:auto;scrollbar-width:thin} .top>.btn,.top>.savestate{flex-shrink:0} .search{min-width:260px}
.brand small{display:none!important}   /* the workbook selector shows the file */
#btnMob{display:none}
.hidebtn{display:none!important}
.wbname{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.menu .mh{padding:6px 9px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650}
.menu{max-height:70vh;overflow:auto}
.ovnote{display:flex;gap:10px;align-items:flex-start;max-width:900px;margin:12px 0 0}
.ovnote .x{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;margin-left:auto}
.wblist{margin-top:14px;border-top:1px solid var(--line2);padding-top:10px}
.wblist .vline{display:flex;gap:10px;align-items:center}
@media (max-width:1600px){.brand small{display:none}}
.brand .logo{height:30px;width:auto;margin-right:4px}
.brand .ttl{border-left:2px solid var(--pink);padding-left:12px;color:var(--accent);white-space:nowrap;min-width:0}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:-2px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.search{position:relative;flex:1;max-width:520px}
.backbtn{flex:none}.backbtn:disabled{opacity:.35}
.search input{width:100%;height:34px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:0 34px 0 34px;outline:none}
.search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-bg)}
.search svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.search kbd{position:absolute;right:9px;top:7px;font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn .badge{background:var(--edit);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;font-weight:600;min-width:18px;text-align:center}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;min-width:0}
.sbres{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:30;touch-action:none}
.sbres:hover,.sbres.drag{background:linear-gradient(90deg,transparent 3px,var(--pink) 3px,var(--pink) 5px,transparent 5px)}
body.resizing{cursor:col-resize;user-select:none}
.side .sfilter{padding:12px 12px 4px}
.sexp{display:flex;gap:6px;padding:0 12px 6px}.sexp button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:11.5px;padding:3px 0;color:var(--muted)}.sexp button:hover{background:var(--panel2);color:var(--accent)}
tr.rcol .cell{max-height:3em;overflow:hidden;position:relative}
.rt{border:0;background:transparent;color:var(--accent);padding:4px 6px 4px 0;min-width:22px;min-height:24px;font-size:14px;line-height:1;cursor:pointer;vertical-align:middle}.rt:hover{color:var(--pink)}
.side .sfilter input{width:100%;height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:0 10px;outline:none}
.side .sfilter input:focus{border-color:var(--accent)}
.nav{overflow:auto;padding:0 8px 16px;flex:1}
.navgroup{margin-top:10px}
.navgroup h4{margin:0;padding:4px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:650;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.navitem{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;color:var(--text)}
.navitem:hover{background:var(--panel2)}
.navitem.active{background:var(--panel2);color:var(--accent);font-weight:650;box-shadow:inset 3px 0 0 var(--pink)}
.navitem .nm{flex:1;min-width:0;white-space:normal;word-break:break-word}
.navitem .nm small{display:block;color:var(--faint);font-weight:400;font-size:12px;overflow-wrap:anywhere}
.navitem .ct{font-size:12px;color:var(--muted);background:var(--slate-bg);border-radius:9px;padding:0 7px}
.navitem .ed{width:7px;height:7px;border-radius:50%;background:var(--edit)}
.navitem .ico{width:16px;color:var(--faint);flex:none;text-align:center}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.vhead{padding:16px 22px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.vhead h1{margin:0;font-size:24px;font-weight:700;color:var(--accent);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vhead .sub{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}
.vhead .desc{color:var(--muted);margin-top:6px;max-width:1100px;white-space:pre-wrap}
.vhead .note{margin-top:8px;padding:6px 10px;border-left:3px solid var(--pink);background:var(--violet-bg);color:var(--edit);border-radius:0 6px 6px 0;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:11.5px;background:var(--slate-bg);color:var(--muted)}
.keybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.chip.custom{background:var(--violet-bg);color:var(--violet)} .chip.pkchip{background:#FEF3D7;color:#7A5200} .chip.warnchip{background:#fff;color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)} .p-pk{background:#FEF3D7;color:#7A5200;font-weight:600} .chip.ootb{background:var(--blue-bg);color:var(--blue)}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:14px;padding:6px 12px;background:var(--panel);min-width:96px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--accent)} .stat.on{border-color:var(--accent);background:var(--accent-bg)}
.stat b{display:block;font-size:20px;color:var(--accent);letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;padding:10px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .grow{flex:1}
.toolbar .count{color:var(--muted);font-size:12.5px}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px 0;background:var(--bg)}
.af{display:inline-flex;gap:6px;align-items:center;background:var(--accent-bg);color:var(--accent-ink);border-radius:6px;padding:2px 4px 2px 9px;font-size:12px}
.af button{border:0;background:transparent;color:inherit;padding:0 4px;font-size:14px;line-height:1}
.gridwrap{flex:1;overflow:auto;margin:10px 22px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);position:relative}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}
.grid th{position:sticky;top:0;z-index:2;background:var(--panel2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding:0;height:34px}
.grid th .th{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 10px;min-height:34px}
.grid th .lbl{flex:1;white-space:normal;line-height:1.25;cursor:pointer;user-select:none}
.grid th .lbl:hover{color:var(--text)}
.grid th .fbtn{border:0;background:transparent;color:var(--faint);padding:6px;min-width:26px;min-height:26px;border-radius:5px;line-height:0}
.grid th .fbtn:hover{background:var(--line);color:var(--text)}
.grid th .fbtn.on{color:var(--accent);background:var(--accent-bg)}
.grid th.hint .lbl{border-bottom:1px dotted var(--faint)}
.grid th.stickycol,.grid td.stickycol{position:sticky;left:0;z-index:3}
.grid td.stickycol{z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--line)}
.grid tr:hover td.stickycol{background:var(--panel2)}
.grid td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.grid tbody tr:hover td{background:var(--panel2)}
.grid tbody tr.sel td{background:var(--accent-bg)}
.grid tbody tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--amber-bg)}100%{background:transparent}}
.cell{word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.dim{color:var(--faint)}
td.edited{background:var(--edit-bg)!important;box-shadow:inset 3px 0 0 var(--edit)}
td.editable{cursor:text}
td.editing{padding:0!important;background:var(--panel)!important;box-shadow:inset 0 0 0 2px var(--accent)}
td.editing textarea,td.editing input{width:100%;min-height:34px;border:0;outline:none;background:transparent;padding:6px 10px;resize:vertical;display:block}
mark{background:#F7D4E7;color:#7B134D;border-radius:2px;padding:0 1px}
.pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;line-height:18px;white-space:normal;overflow-wrap:break-word;vertical-align:top}
.p-lookup{background:var(--blue-bg);color:var(--blue)} .p-choice{background:var(--violet-bg);color:var(--violet)}
.p-text{background:var(--slate-bg);color:#3b5a73} .p-num{background:#D3E1EC;color:#061A46}
.p-date{background:#FBE6F1;color:#BB1C73} .p-bool{background:#C9DAE8;color:#061A46}
.p-red{background:var(--red-bg);color:var(--red);font-weight:600} .p-amber{background:#fff;color:var(--pink);box-shadow:inset 0 0 0 1px var(--pink)} .p-green{background:var(--green-bg);color:var(--green)}
.p-blue{background:var(--blue-bg);color:var(--blue)} .p-violet{background:var(--violet-bg);color:var(--violet)} .p-slate{background:var(--slate-bg);color:var(--muted)}
.addl{font-size:12px;color:var(--muted)}
.addl .kv b{color:var(--text);font-weight:600}
.addl ul{margin:2px 0 0;padding:0 0 0 14px}
.tchip{display:inline-block;margin:1px 4px 1px 0;padding:0 8px;border-radius:6px;background:var(--blue-bg);color:var(--blue);cursor:pointer;font:11.5px ui-monospace,monospace}
.tchip.dead{cursor:default;background:var(--slate-bg);color:var(--muted)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.more{padding:14px;text-align:center}
/* popover */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:272px;max-height:420px;display:flex;flex-direction:column}
.pop .ph{padding:10px 10px 6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.pop input[type=text]{margin:0 10px 6px;width:calc(100% - 20px);height:30px;border:1px solid var(--line);border-radius:7px;padding:0 9px;background:var(--panel2);outline:none}
.pop .plist{overflow:auto;padding:0 6px;flex:1}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--panel2)}
.pop label span.n{flex:none;margin-left:auto;color:var(--faint);font-size:11.5px}
.pop .pf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px}
.menu button,.menu label{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:6px}
.menu button:hover,.menu label:hover{background:var(--panel2)}
.menu button:has(small){flex-direction:column;align-items:flex-start;gap:0}
.menu button small{color:var(--faint);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* drawers */
.fcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:var(--panel)}
.fcard.cur{border-color:var(--accent);background:var(--accent-bg)}
.fcard .fn{font-weight:650;color:var(--accent);overflow-wrap:anywhere}
.fcard .fbtns{display:flex;gap:6px;flex-wrap:wrap}
.drawer{position:fixed;top:58px;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s ease}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.drawer .body{overflow:auto;padding:12px 16px 40px;flex:1}
.fld{margin-bottom:12px}
.fld .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;margin-bottom:2px}
.fld .v{padding:6px 9px;border:1px solid transparent;border-radius:7px;white-space:pre-wrap;word-break:break-word;min-height:30px;cursor:text}
.fld .v:hover{border-color:var(--line);background:var(--panel2)}
.fld .v.edited{background:var(--edit-bg);border-color:var(--edit)}
.fld textarea,.fld input{width:100%;border:1px solid var(--accent);border-radius:7px;padding:6px 9px;background:var(--panel);outline:none;min-height:34px;box-shadow:0 0 0 3px var(--accent-bg)}
.fld input[type=checkbox],.fld input[type=radio]{width:auto;min-height:0;height:auto;padding:0;border:0;box-shadow:none;accent-color:var(--accent)}
.vsec{margin-bottom:16px}.vsec h4{margin:0 0 6px;font-size:13px}.vline{padding:5px 0;border-bottom:1px solid var(--line2);word-break:break-word}.vline .d{margin-top:4px;display:grid;gap:4px}.vline .o{background:var(--slate-bg);color:var(--muted);padding:2px 7px;border-radius:5px;white-space:pre-wrap;text-decoration:line-through;text-decoration-color:rgba(123,19,77,.5)}.vline .nw{background:var(--accent-bg);color:var(--accent);padding:2px 7px;border-radius:5px;white-space:pre-wrap}
td.upd{background:var(--accent-bg)!important;box-shadow:inset 3px 0 0 var(--accent)}
.navitem .ed.vd{background:var(--accent)}
.readme{flex:1;overflow:auto;padding:28px 24px 72px;background:var(--panel2)}
.readme .rwrap{max-width:940px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px 44px 44px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.readme h1{margin:0 0 6px;font-size:28px;color:var(--accent)}
.readme .lead{color:var(--muted);font-size:15px;margin:0 0 20px;line-height:1.55}
.readme .toc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;padding:12px 0 2px;border-top:1px solid var(--line2)}
.readme .toc a{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--accent);text-decoration:none;background:var(--panel)}
.readme .toc a:hover{border-color:var(--accent);background:var(--accent-bg)}
.readme h2{font-size:17px;margin:34px 0 10px;padding-top:18px;border-top:1px solid var(--line2);color:var(--accent);display:flex;align-items:center;gap:8px;scroll-margin-top:12px}
.readme p{line-height:1.6}
@media (max-width:860px){.readme{padding:0}.readme .rwrap{border:0;border-radius:0;padding:20px 16px 40px}}
.readme h2 .n{background:var(--pink);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.readme ul,.readme ol{padding-left:20px;margin:6px 0}
.readme li{margin:3px 0}
.rcard{border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:10px 0;background:var(--panel)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:10px 0}
.rgrid .rcard{margin:0}
.rcard h3{margin:0 0 6px;font-size:13.5px;color:var(--accent)}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:12px 0 18px}
@media (max-width:1100px){.flow{display:flex;flex-wrap:wrap;gap:8px}}
.flow .step{flex:1;min-width:0;font-size:13px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2)}
.flow .step b{display:block;color:var(--accent);margin-bottom:2px}
.flow .arrow{align-self:center;color:var(--pink);font-weight:700}
.readme kbd{font:11.5px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--panel)}
.readme table{border-collapse:collapse;margin:8px 0;width:100%}
.readme td,.readme th{border-bottom:1px solid var(--line2);padding:6px 10px;text-align:left;vertical-align:top}
.readme th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.note2{border-left:3px solid var(--pink);background:var(--violet-bg);color:var(--edit);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;max-width:800px}
.stats .tyrow{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tylbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:650;margin-right:2px}
.stat.ty{min-width:0;padding:4px 11px;border-radius:999px;display:inline-flex;gap:7px;align-items:baseline}
.stat.ty b{display:inline;font-size:14px}
.stat.ty span{font-size:11.5px}
.subs{padding:6px 16px 18px;border-top:2px solid var(--line);margin-top:6px;position:sticky;left:0}
.subsec{margin:12px 0}.subsec h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
.subtbl{border-collapse:collapse;width:100%;max-width:900px;table-layout:auto}
.subtbl th{background:var(--panel2);color:var(--muted);font-size:12px;text-align:left;padding:5px 10px;border-bottom:1px solid var(--line)}
.subtbl td{padding:5px 10px;border-bottom:1px solid var(--line2);vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
.xtag{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--pink);color:#fff;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:middle}
.fld .orig{font-size:11.5px;color:var(--muted);margin:3px 2px 0}
.fld .orig a{margin-left:6px}

<script>
const DME_VERSION="__VERSION__";   // from package.json, written in by build.py
const EMBEDDED_B64 = "__B64__";
const TEMPLATE_B64 = "__TEMPLATE_B64__";

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=v=>{
  if(v===null||v===undefined) return '';
  if(v===true) return 'True'; if(v===false) return 'False';
  return String(v).replace(/_x000D_/g,'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{2,}/g,'\n').trim();
};
const norm=s=>String(s||'').toLowerCase().replace(/^formus_?/,'').replace(/[^a-z0-9]/g,'');
// set() returns false when the browser refuses to store (quota, private mode, blocked site data)
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// header indicator: are the edits safely stored in this browser?
function saveState(ok,msg){
  const el=$('#saveState'); if(!el) return;
  el.className='savestate '+(ok?'ok':'bad');
  el.textContent=ok?'Saved':'Not saved';
  el.title=msg||(ok?'Your edits are stored in this browser and survive a reload.':'This browser would not store your edits. They will be lost on reload. Export the change log or the workbook now.');
  if(!ok&&!saveState.warned){saveState.warned=true;toast('Your edits could not be saved in this browser. Export them before closing the page.')}
  if(ok) saveState.warned=false;
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
const ICON_FILTER='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>';

/* ---------- state ---------- */
const S={fileName:'',sheets:[],byLogical:{},views:{},cur:null,edits:new Map(),metaEd:new Map(),pending:[],diff:null,rowOv:new Map(),ui:{density:'normal',hidden:{}},sideFilter:'',storeKey:'',collapsed:{}};
const HIDE_DEFAULT=['Schema Name','Type','Object Type Code','Relationship Name'];   // Relationship Name: optional, the solution generator names relationships when it is blank
const WIDTHS={'Logical Name':240,'Schema Name':200,'Display Name':190,'Attribute Type':150,'Description':300,'Custom Attribute':100,'Type':84,'Required Level':175,'Additional data':290,'Add to RAF Form?':190,'Comment':280,'Field Level Security':110,
 'Table':190,'Area':130,'Table Name':170,'Out of the box/custom table?':130,'Static Data?':90,'Purpose':360,'FormusPro Comments':300,'Added to ERD?':90,'Defined in data model?':110};
const ENUM_COLS=new Set(['custom attribute','required level','attribute type','type']);
S.tmplOpts={};
const nk=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const FREE_RE=/description|comment|additional|purpose|notes?\b|logical|schema|display name|table name|\bname$|\bid$/i;
function colValues(sh,col){
  if(sh.kind==='entity') return S.allView.items.map(x=>getVal(x.sh,x.row,col));
  return sh.rows.map(r=>getVal(sh,r,col));
}
function isChoiceCol(sh,col){
  const l=col.toLowerCase();
  if(ENUM_COLS.has(l)||(S.tmplOpts[l]&&S.tmplOpts[l].length)) return true;
  if(col==='Table'||FREE_RE.test(col)) return false;
  const key=(sh.kind==='entity'?'E':'T'+sh.idx)+'|'+l;
  S.choiceCache=S.choiceCache||{};
  if(key in S.choiceCache) return S.choiceCache[key];
  const vals=colValues(sh,col).map(v=>String(v||'').replace(/\s+/g,' ').trim()).filter(Boolean);
  const set=new Set(vals.map(nk));
  const ok=vals.length>=4&&set.size>=1&&set.size<=15&&set.size<=Math.max(2,vals.length*0.4)&&vals.every(v=>v.length<=80);
  return S.choiceCache[key]=ok;
}
function choiceOptions(sh,col){
  const m=new Map();
  const add=(v,n)=>{v=String(v||'').replace(/\s+/g,' ').trim();if(!v)return;const k=nk(v);const e=m.get(k);if(e){e.n+=n;if(n>=e.b){e.b=n;e.label=v}}else m.set(k,{label:v,n,b:n,k})};
  colValues(sh,col).forEach(v=>add(v,1));
  (S.tmplOpts[col.toLowerCase()]||[]).forEach(v=>add(v,0.5));
  return [...m.values()].sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label));
}

/* ---------- parsing ---------- */
function canonHeader(h){
  const t=clean(h); const l=t.toLowerCase();
  if(l==='add to raf form?') return 'Add to RAF Form?';
  return t;
}
function parseWorkbook(wb){
  const sheets=[];
  wb.SheetNames.forEach((name,idx)=>{
    const ws=wb.Sheets[name]; if(!ws) return;
    if(name==='Change log') return; // written by this tool on export
    const m=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:true});

    if(!m.length) return;
    let hi=m.findIndex(r=>clean(r[0]).toLowerCase()==='logical name'&&clean(r[1]).toLowerCase()==='schema name');

    if(hi<0){

    const seen={},rowMap={};
    rows.forEach(rw=>{let k=(rw.orig[kc]||rw.orig.find(v=>v!=='')||('row '+rw.r)).toLowerCase().slice(0,80);seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+='#'+seen[k];rw.key=k;rowMap[k]=rw;});
    const subs=[];

    const sh={idx:sheets.length,name,kind,cols,rows,meta,mo,hints,notes,noteCells,subs,pos:colIdx.map(c=>c+1+c0),hdrRow:hi+1+r0,r0,

    sh.tmplAdded=[];

}

function storedEdits(proj){return store.get(editKey(proj))||[]}
function applyStored(){

    if(rec.a||rec.d) return;
    const sh=S.sheets.find(s=>s.name===rec.s)||(rec.l&&S.sheets.find(s=>s.kind==='entity'&&s.logical===rec.l));

const T={name:'',b64:'',sheets:[],byName:{},entityCols:[]};
function loadTemplate(b64,name){

  const sheets=parseWorkbook(XLSX.read(b64ToU8(b64),{type:'array'}));

  const ents=sheets.filter(s=>s.kind==='entity');
  const u=[];ents.forEach(s=>s.cols.forEach(c=>{if(!u.includes(c))u.push(c)}));
  T.entityCols=u;
  {const tm=[];ents.forEach(s=>s.meta.forEach(([k])=>{if(!tm.some(x=>x.toLowerCase()===k.toLowerCase()))tm.push(k)}));T.entityMeta=tm}

async function readTemplateOpts(b64){
  S.tmplOpts={};
  try{
    const ct=v=>v==null?'':typeof v==='object'?(v.richText?v.richText.map(x=>x.text).join(''):v.result!=null?String(v.result):v.text!=null?String(v.text):''):String(v);
    const cn=L=>L.split('').reduce((a,c)=>a*26+c.charCodeAt(0)-64,0);
    const buf=b64ToU8(b64); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf.buffer.slice(buf.byteOffset,buf.byteOffset+buf.byteLength));
    wb.worksheets.forEach(ws=>{
      let hdr=null;
      ws.eachRow((row,r)=>{if(hdr)return;if(ct(row.getCell(1).value).trim()==='Logical Name'&&ct(row.getCell(2).value).trim()==='Schema Name'){hdr={};row.eachCell((cell,c)=>{hdr[c]=ct(cell.value).trim()})}});
      if(!hdr) return;
      const dv=(ws.dataValidations&&ws.dataValidations.model)||{}; const seen=new Set();
      Object.keys(dv).forEach(addr=>{
        const d=dv[addr]; if(!d||d.type!=='list'||!d.formulae||!d.formulae[0]) return;
        const m=addr.match(/^([A-Z]+)\d+$/); if(!m) return;
        const name=hdr[cn(m[1])]; if(!name||seen.has(name)) return; seen.add(name);
        const f=String(d.formulae[0]).trim(); let vals=[];
        if(/^".*"$/.test(f)) vals=f.slice(1,-1).split(',');
        else{const r=f.match(/^(?:'?([^'!]+)'?!)?\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?$/);
          if(r){const w=(r[1]&&wb.getWorksheet(r[1]))||ws;const c1=cn(r[2]),c2=r[4]?cn(r[4]):c1,r1=+r[3],r2=r[5]?+r[5]:r1;for(let rr=r1;rr<=r2;rr++)for(let cc=c1;cc<=c2;cc++)vals.push(ct(w.getCell(rr,cc).value))}}
        vals=vals.map(s=>s.trim()).filter(Boolean);
        if(vals.length){const k=name.toLowerCase();S.tmplOpts[k]=[...new Set((S.tmplOpts[k]||[]).concat(vals))]}
      });
    });
  }catch(e){}
}

function renderTemplate(){
  const d=$('#tmplpanel'); const C=S.conf||[];
  const newT=C.filter(x=>x.isNew), extra=C.filter(x=>x.extra.length), miss=C.filter(x=>x.missing.length);
  let h=`<header><div style="flex:1;min-width:0"><h3>Template</h3><div class="mono dim">${esc(T.name)} · ${T.sheets.length} sheets</div></div><button class="btn ghost" data-tclose>✕</button></header><div class="body">

}
function vstate(id){
  if(!S.views[id]) S.views[id]={sort:null,filters:{},q:'',quick:{},shown:150};
  return S.views[id];
}
function cellVal(view,it,col){
  if(col==='Table') return it.sh.label;
  return getVal(it.sh,it.row,col);
}
function facet(col,v){
  v=(v||'').replace(/\s+/g,' ').trim();
  const l=col.toLowerCase();
  if(l==='required level'){
    const k=v.toLowerCase().replace(/[^a-z]/g,'');
    return ({'':'(blank)',none:'None',businessrequired:'BusinessRequired',systemrequired:'SystemRequired',applicationrequired:'ApplicationRequired',recommended:'Recommended',optional:'Optional',rollup:'Roll-up',formula:'Formula'})[k]||v;
  }
  if(l==='custom attribute') return v===''?'(blank)':(v.toLowerCase()==='true'?'True':'False');
  return v===''?'(blank)':v;
}
function hidden(view){
  // keyed by sheet name, not position, so a choice made in one workbook doesn't hide a column in another
  const key=view.kind==='all'?'__all':'s:'+view.sh.name.toLowerCase();
  if(!S.ui.hidden[key]){
    S.ui.hidden[key]=HIDE_DEFAULT.filter(c=>view.cols.includes(c));
    if(view.kind==='all') S.ui.hidden[key].push('Description');
  }
  return S.ui.hidden[key];
}
function visibleCols(view){const h=hidden(view);return view.cols.filter(c=>!h.includes(c))}

function filterItems(view){
  const st=vstate(view.id);
  const q=st.q.trim().toLowerCase();
  const terms=q?q.split(/\s+/):[];
  const cols=view.cols;
  const quick=st.quick;
  const rafCol=cols.find(c=>c.toLowerCase()==='add to raf form?');
  const customCol=cols.find(c=>c.toLowerCase()==='custom attribute');
  const cmtCol=cols.find(c=>c.toLowerCase()==='comment');
  const reqCol=cols.find(c=>c.toLowerCase()==='required level');
  let out=view.items.filter(it=>{
    if(terms.length){
      const hay=cols.map(c=>cellVal(view,it,c)).join('\n').toLowerCase();
      for(const t of terms) if(!hay.includes(t)) return false;
    }
    if(quick.custom&&customCol&&facet(customCol,getVal(it.sh,it.row,customCol))!=='True') return false;
    if(quick.raf&&rafCol&&getVal(it.sh,it.row,rafCol)==='') return false;
    if(quick.comment&&cmtCol&&getVal(it.sh,it.row,cmtCol)==='') return false;
    if(quick.req&&reqCol&&!/required/i.test(facet(reqCol,getVal(it.sh,it.row,reqCol)))) return false;
    if(quick.changed&&!(it.row.isNew||it.row.chg)) return false;
    if(view.kind==='all'&&st.areas&&st.areas.size&&!st.areas.has(areaOf(it.sh))) return false;
    if(quick.edited){let e=false;for(const c of cols){if(c!=='Table'&&isEdited(it.sh,it.row,c)){e=true;break}}if(!e)return false}
    for(const c in st.filters){
      const f=st.filters[c];
      const v=cellVal(view,it,c);
      if(f.text&&!v.toLowerCase().includes(f.text.toLowerCase())) return false;
      if(f.sel&&!f.sel.has(facet(c,v))) return false;
    }
    return true;
  });
  if(st.sort){
    const {col,dir}=st.sort;
    out=out.map((it,i)=>[it,i]).sort((a,b)=>{
      const x=cellVal(view,a[0],col),y=cellVal(view,b[0],col);
      const r=x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'});
      return (r*dir)||(a[1]-b[1]);
    }).map(x=>x[0]);
  }
  return out;
}

/* ---------- rendering: main ---------- */
function pillType(v){
  const l=v.toLowerCase();
  const cls=/lookup|owner|customer/.test(l)?'p-lookup':/choice|state|status|picklist/.test(l)?'p-choice':/date/.test(l)?'p-date':/whole|currency|double|decimal|number|big/.test(l)?'p-num':/two options|boolean/.test(l)?'p-bool':'p-text';
  return `<span class="pill ${cls}">${esc(v)}</span>`;
}
function hl(text,terms){
  // match on the raw text, then escape each piece, so a search for "amp" or "lt" can't break &amp; or &lt;
  text=String(text??''); terms=terms.filter(Boolean);
  if(!terms.length) return esc(text);
  const re=new RegExp('('+terms.sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return text.split(re).map((p,i)=>i%2?'<mark>'+esc(p)+'</mark>':esc(p)).join('');
}
function renderAddl(text,full){
  if(!text) return '';
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  let html='',sec=null,buf=[];
  const flush=()=>{
    if(sec===null) return;
    if(/^targets?$/i.test(sec)){
      html+='<div class="kv"><b>Targets</b> '+buf.map(t=>{const hit=S.byLogical[t.toLowerCase()];return hit!=null?`<span class="tchip" data-golog="${esc(t.toLowerCase())}" title="Open ${esc(S.sheets[hit].label)}">${esc(t)}</span>`:`<span class="tchip dead" title="Not in this workbook">${esc(t)}</span>`}).join('')+'</div>';
    } else if(/^options?$/i.test(sec)){
      const items=full?buf:buf.slice(0,4);
      html+='<div class="kv"><b>Options</b> ('+buf.length+')<ul>'+items.map(o=>'<li>'+esc(o.replace(/\s*\(no color\)\s*$/i,''))+'</li>').join('')+(!full&&buf.length>4?'<li class="dim">+'+(buf.length-4)+' more…</li>':'')+'</ul></div>';
    } else {
      html+='<div class="kv"><b>'+esc(sec)+'</b> '+esc(buf.join(', '))+'</div>';
    }
    sec=null;buf=[];
  };
  lines.forEach(l=>{
    const m=l.match(/^([^:]{1,40}):\s*(.*)$/);
    if(m&&!/^\d+$/.test(m[1])){ // header-ish
      flush();
      if(m[2]===''){sec=m[1];buf=[]}
      else html+='<div class="kv"><b>'+esc(m[1])+'</b> '+esc(m[2])+'</div>';
    } else if(sec!==null) buf.push(l);
    else html+='<div class="kv">'+esc(l)+'</div>';
  });
  flush();
  return '<div class="addl">'+html+'</div>';
}
function cellHTML(view,it,col,terms){
  const v=cellVal(view,it,col); const l=col.toLowerCase();
  if(col==='Table') return `<a href="#" data-go="${it.sh.idx}" data-goname="${esc(it.row.vals[0])}">${hl(v,terms)}</a>`;
  if(v==='') return l==='required level'?'':'';
  if(l==='attribute type') return pillType(v);
  if(l==='required level'){
    const f=facet(col,v);
    const cls=f==='SystemRequired'?'p-red':/Required/.test(f)?'p-amber':f==='Recommended'?'p-blue':'p-slate';
    return f==='None'?'<span class="dim">–</span>':`<span class="pill ${cls}">${esc(f)}</span>`;
  }
  if(l==='custom attribute') return facet(col,v)==='True'?'<span class="pill p-violet">Custom</span>':'<span class="dim">Standard</span>';
  if(l==='add to raf form?') return `<span class="pill p-green">${hl(v,terms)}</span>`;
  if(l==='field level security') return `<span class="pill p-amber">${esc(v)}</span>`;
  if(l==='additional data') return renderAddl(v,true);
  if(l==='logical name'||l==='schema name') return `<span class="mono">${hl(v,terms)}</span>`;
  if(/^(static data\?|added to erd\?|defined in data model\?)$/.test(l)) return `<span class="pill ${/^yes/i.test(v)?'p-green':'p-slate'}">${esc(v)}</span>`;
  if(l==='out of the box/custom table?') return `<span class="pill ${/custom/i.test(v)?'p-violet':/ootb/i.test(v)?'p-blue':'p-slate'}">${esc(v)}</span>`;
  if(l==='area') return `<span class="pill p-slate">${esc(v)}</span>`;
  if(l==='table name'&&it.row.link!=null) return `<a href="#" data-go="${it.row.link}"><b>${hl(v,terms)}</b></a>`;
  return hl(v,terms);
}
function isEditable(view,col){return col!=='Table'}
function lookupCount(sh){
  const i=sh.colIdx['Attribute Type']; if(i===undefined) return 0;
  let n=0; sh.rows.forEach(r=>{if(/^lookup$/i.test(r.vals[i]))n++}); return n;
}
function statOn(s,st){if(s.filter){const f=st.filters[s.filter[0]];return !!(f&&f.sel&&f.sel.size===1&&f.sel.has(s.filter[1]))}return !!(s.k&&st.quick[s.k])}
function statTile(s,st){
  let on=s.k&&st.quick[s.k];
  if(s.filter){const f=st.filters[s.filter[0]];on=!!(f&&f.sel&&f.sel.size===1&&f.sel.has(s.filter[1]))}
  return `<button class="stat ${s.type?'ty':''} ${on?'on':''}" ${s.k?`data-quick="${s.k}"`:''} ${s.filter?`data-qf="${esc(s.filter.join('|'))}"`:''}><b>${s.v}</b><span>${esc(s.l)}</span></button>`;
}
function typeStats(view){
  const ac=view.cols.find(c=>c.toLowerCase()==='attribute type'); if(!ac) return [];
  const m=new Map();
  view.items.forEach(it=>{const f=facet(ac,getVal(it.sh,it.row,ac));if(f==='(blank)')return;m.set(f,(m.get(f)||0)+1)});
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,v])=>({type:true,v,l:k,filter:[ac,k]}));
}
function statsHTML(view,st){
  const ty=typeStats(view);
  // field types: the eight most common, the rest behind "+N more" (a filtered type always stays visible)
  const show=S.ui.allTypes?ty:ty.filter((s,i)=>i<8||statOn(s,st)), more=ty.length-show.length;
  return stats(view).map(s=>statTile(s,st)).join('')+(ty.length?`<div class="tyrow"><span class="tylbl">By field type</span>${show.map(s=>statTile(s,st)).join('')}${more?`<button class="btn ghost" data-act="alltypes" style="height:26px">+${more} more</button>`:S.ui.allTypes&&ty.length>8?`<button class="btn ghost" data-act="alltypes" style="height:26px">Fewer</button>`:''}</div>`:'');
}
function stats(view){
  const items=view.items; const cols=view.cols;
  const g=n=>cols.find(c=>c.toLowerCase()===n);
  const cc=g('custom attribute'),rc=g('required level'),fc=g('add to raf form?'),mc=g('comment'),ac=g('attribute type');
  if(view.kind==='all'||(view.sh&&view.sh.kind==='entity')){
    const n=(fn)=>items.filter(fn).length;
    return [
      {k:'',v:items.length,l:'fields'},
      cc&&{k:'custom',v:n(it=>facet(cc,getVal(it.sh,it.row,cc))==='True'),l:'custom'},
      rc&&{k:'req',v:n(it=>/required/i.test(facet(rc,getVal(it.sh,it.row,rc)))),l:'required'},
      fc&&{k:'raf',v:n(it=>getVal(it.sh,it.row,fc)!==''),l:'on RAF form'},
      mc&&{k:'comment',v:n(it=>getVal(it.sh,it.row,mc)!==''),l:'with comments'},
    ].filter(Boolean);
  }
  const out=[{k:'',v:items.length,l:'rows'}];
  if(view.sh&&view.sh.isDict){const n=S.sheets.filter(s=>s.kind==='entity').reduce((a,s)=>a+lookupCount(s),0);out.push({k:'',v:n,l:'lookups across all tables'})}
  return out;
}

  });
  h+='</tr></thead><tbody>';
  for(let i=0;i<upto;i++){

/* ---------- editing ---------- */
function startEdit(td,it,col){
  if(td.classList.contains('editing')) return;
  const view=S.view; const sh=it.sh,row=it.row;
  const cur=getVal(sh,row,col);
  const l=col.toLowerCase();
  td.classList.add('editing');
  const long=cur.length>60||cur.includes('\n')||/comment|description|additional|purpose/i.test(col);
  const choice=isChoiceCol(sh,col)&&cur.length<=60&&!cur.includes('\n');
  let el,touched=false,isSel=false,swapping=false;
  const mkInput=()=>{const i=document.createElement('input');i.type='text';i.value=cur;return i};
  if(choice){
    isSel=true; const ck=nk(cur); const opts=choiceOptions(sh,col);
    el=document.createElement('select'); el.className='cellsel';
    el.innerHTML='<option value="">(blank)</option>'+opts.map(o=>`<option value="${esc(o.label)}" ${cur&&o.k===ck?'selected':''}>${esc(o.label)}</option>`).join('')+(cur&&!opts.some(o=>o.k===ck)?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:'')+'<option value="__new__">＋ New value…</option>';
    if(!cur) el.value='';
  } else if(!long){ el=mkInput(); }
  else {el=document.createElement('textarea'); el.value=cur; el.rows=Math.min(8,Math.max(3,cur.split('\n').length+1))}
  td.innerHTML=''; td.appendChild(el); el.focus(); if(el.select&&!long&&!isSel) el.select();
  let done=false;
  const finish=(commit)=>{
    if(done) return; done=true;
    if(commit&&(!isSel||touched)&&el.value!==cur&&el.value!=='__new__'){setVal(sh,row,col,el.value); askLookupTarget(sh,row,col,()=>{afterEdit()})}
    afterEdit();
  };
  const wire=(e,sel)=>{
    e.addEventListener('keydown',ev=>{
      if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();finish(false)} // Esc cancels the edit only, it doesn't also close panels
      else if(ev.key==='Enter'&&(sel||!long||!ev.shiftKey)){ev.preventDefault();finish(true)}
      else if(ev.key==='Tab'){ev.preventDefault();finish(true)}
    });
    e.addEventListener('blur',()=>{if(!swapping)finish(true)});
  };
  wire(el,isSel);
  if(isSel) el.addEventListener('change',()=>{
    touched=true;
    if(el.value==='__new__'){
      const old=el; const i=mkInput(); i.value=''; i.placeholder='New value for '+col;
      swapping=true; isSel=false; touched=false; el=i; td.innerHTML=''; td.appendChild(i); wire(i,false); swapping=false; i.focus();
    } else finish(true);
  });
}
function afterEdit(){

// A field changed to Lookup with no table in "Targets:" yet: ask which table, then write "Targets: <table>" into Additional data
// (and N:1 into an empty Relationship Type), as Add field does for a new lookup. Skipping leaves it for Checks to flag.
function askLookupTarget(sh,row,col,done){
  if(col!=='Attribute Type'||!/^lookup$/i.test(getVal(sh,row,col).trim())||sh.colIdx['Additional data']===undefined||lookupTargetsOf(sh,row).length) return;
  const ln=getVal(sh,row,'Logical Name').trim(), name=getVal(sh,row,'Display Name').trim()||ln||'this field';
  const tables=[...new Set([...S.sheets.filter(s=>s.kind==='entity'&&s.logical).map(s=>s.logical.toLowerCase()).sort(),'account','contact','systemuser','team','businessunit','transactioncurrency'])];
  const m=document.createElement('div'); m.className='convmask'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Lookup table');
  m.innerHTML=`<div class="convbox solbox" style="max-width:520px"><h3>Which table does ${esc(name)} look up to?</h3><p class="dim" style="margin:4px 0 12px">Adds <span class="mono">Targets:</span> and the table to Additional data${sh.colIdx['Relationship Type']!==undefined&&!getVal(sh,row,'Relationship Type').trim()?', and N:1 as the Relationship Type':''}.</p>
    <label class="solf"><span>Related table (logical name)</span><input data-lt list="dme-lt" autocomplete="off" spellcheck="false" placeholder="for example account"><small></small></label><datalist id="dme-lt">${tables.map(t=>`<option value="${esc(t)}"></option>`).join('')}</datalist>

    <div class="convbtns"><button class="btn" data-lta="skip">Skip</button> <button class="btn primary" data-lta="go">Add target</button></div></div>`;
  document.body.appendChild(m);
  const inp=m.querySelector('[data-lt]');
  const close=()=>{document.removeEventListener('keydown',key,true);m.remove()};
  const go=()=>{const tg=inp.value.trim().toLowerCase();
    if(!/^[a-z][a-z0-9_]*$/.test(tg)){m.querySelector('#lterr').textContent='Pick a table, or type its logical name (lower-case letters, digits and underscores).';return}
    const ad=getVal(sh,row,'Additional data').replace(/\s+$/,'');

}

/* ---------- change log ---------- */
function renderChanges(){

function filterPop(col,anchor){

async function buildOriginal(){
  if(!hasWrites()){toast('No edits to apply to the original');return null}
  if(!/\.xlsx$/i.test(S.fileName)){toast('Updating the original needs an .xlsx file. Use the template export instead.');return null}
  // Patch only the edited cells inside the original file's XML, so everything else (line breaks, styles,
  // validations, widths) is carried over byte for byte.
  const zip=await JSZip.loadAsync(b64ToU8(S.curB64));
  const parse=s=>new DOMParser().parseFromString(s,'application/xml');
  const wbx=parse(await zip.file('xl/workbook.xml').async('string')), rels=parse(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  const relT={}; [...rels.getElementsByTagName('Relationship')].forEach(r=>{relT[r.getAttribute('Id')]=r.getAttribute('Target')});
  const pathOf={}; [...wbx.getElementsByTagName('sheet')].forEach(s=>{
    const id=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'); let tg=relT[id]||''; tg=tg.replace(/^\/?(xl\/)?/,''); pathOf[s.getAttribute('name')]='xl/'+tg});
  // every edit ends up either placed (and checked below) or in `missed` with a reason. Callers refuse to save while anything is missed.
  const bySheet={}, missed=[], placed=[]; let n=0;
  // rows added in the page go in the empty rows straight after the field list. Rows are never inserted, so nothing
  // below (Forms, Views, validations) moves; if a section follows with too few empty rows, the save is refused.
  const slot=new Map(), styleRow=new Map();
  S.sheets.forEach(sh=>{
    const add=sh.rows.filter(r=>r.added&&r.vals.some(v=>v!=='')); if(!add.length) return;
    const real=sh.rows.filter(r=>!r.added&&r.r!=null).map(r=>r.r);
    let next=Math.max(sh.hi==null?-1:sh.hi,...real)+1; const lim=sh.fieldEnd==null?Infinity:sh.fieldEnd;
    add.forEach(r=>{if(next<lim){slot.set(r,next++);if(real.length)styleRow.set(r,Math.max(...real)+1+(sh.r0||0))}});
  });
  S.edits.forEach(e=>{
    const sh=e.sh, ci=sh.colIdx[e.col];
    if(!pathOf[sh.name]||!zip.file(pathOf[sh.name])){missed.push({e,why:'the sheet was not found in the file'});return}
    const rr=e.row.added?slot.get(e.row):e.row.r;
    if(e.row.added&&rr==null){missed.push({e,why:'there is no empty row for this new row above the Forms and Views section'});return}
    if(ci===undefined||rr==null||!sh.pos){missed.push({e,why:'the cell position is unknown'});return}
    (bySheet[sh.name]=bySheet[sh.name]||[]).push({e,row:rr+1+(sh.r0||0),col:sh.pos[ci],v:e.nw,sr:styleRow.get(e.row)});
  });

// Inserting rows into a sheet's XML. Moved with the rows: every row and cell below, the sheet's size, merged cells,

// references to this sheet's cells in its own formulas, lists and rules. Not attempted (the reason is returned) when
// something else could point at those rows: Excel tables, drawings, comments, or other sheets and names referring to it.
async function insertRowsBlocked(zip,wbx,pathOf,name,xml){
  if(/<tableParts\b[^>]*count="[1-9]/.test(xml)||/<tablePart\b/.test(xml)) return 'the sheet holds an Excel table';
  if(/<(drawing|legacyDrawing|legacyDrawingHF)\b/.test(xml)) return 'the sheet holds drawings or comments';
  const q=name.replace(/'/g,"''"), ref=new RegExp("(^|[^A-Za-z0-9_.])('"+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"'|"+name.replace(/[.*+?^${}()|[\]\\ ]/g,'\\$&')+")!",'i');
  const names=[...wbx.getElementsByTagName('definedName')].map(d=>d.textContent).filter(t=>ref.test(t)&&!/^#REF!/.test(t));
  if(names.length) return 'a named range refers to the sheet';

    const ox=await zip.file(p).async('string'), fs=(ox.match(/<f\b[^>]*>[^<]*<\/f>/g)||[]).join(' ').replace(/&apos;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&');

function shiftRows(xml,at,K){
  const state=tag=>/\bstate="(frozen|frozenSplit)"/.test(tag);   // a frozen pane's ySplit counts rows (a plain split is measured in points)

  const fx=t=>t.split(/("[^"]*")/).map((part,i)=>i%2?part:part.replace(/(^|[^A-Za-z0-9_!'.$])(\$?)([A-Z]{1,3})(\$?)(\d+)(?![\d(A-Za-z_])/g,(m,pre,d1,c,d2,r)=>pre+(+r>=at?d1+c+d2+(+r+K):d1+c+d2+r))).join('');
  xml=xml.replace(/<row\b[^>]*>/g,tag=>tag.replace(/\br="(\d+)"/,(m,r)=>+r>=at?'r="'+(+r+K)+'"':m));
  xml=xml.replace(/<c\b[^>]*>/g,tag=>tag.replace(/\br="([A-Z]+)(\d+)"/,(m,c,r)=>+r>=at?'r="'+c+(+r+K)+'"':m));

// tells the person which edits could not be written; nothing is saved or cleared while this list is not empty

// the suggested name for a new copy: a version number in the name goes up by one (v1.2 -> v1.3), otherwise a suffix is added
function nextName(name,suffix){

// asks for the file name before a workbook is downloaded; resolves to the name (ending .xlsx) or null when cancelled
function nameDialog(def,what){

    const m=document.createElement('div'); m.className='convmask'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-label','Name the file');
    m.innerHTML=`<div class="convbox dlgbox namebox"><h3>Name the file</h3><p class="dim" style="margin:4px 0 10px">${esc(what)}</p>

      <div class="convbtns"><button class="btn" data-n="0">Cancel</button><button class="btn primary" data-n="1">Download</button></div></div>`;

    m.addEventListener('click',e=>{const b=e.target.closest('[data-n]'); if(b) done(b.dataset.n==='1'); else if(e.target===m) done(false)});

    download(base+' - differences '+S.diff.pl+' to '+S.diff.cl+'.csv',new Blob([csv(diffRows())],{type:'text/csv'}));
  } else if(kind==='bundled'){
    dlg({title:'Go back to the bundled workbook?',body:'The loaded versions are forgotten. Your edits are kept.',ok:'Go back'}).then(ok=>{if(ok){store.set('dme.cur',null);store.set('dme.prev',null);Promise.all([idb.del('__cur'),idb.del('__prev')]).catch(()=>{}).then(()=>location.reload())}});
  } else if(kind==='reset'){
    if(!changeTotal()) return toast('Nothing to discard');
    dlg({title:'Discard all edits?',body:'All '+S.edits.size+' edit'+(S.edits.size===1?'':'s')+' will be reverted to the original values'+(addedRows().length?', and the '+addedRows().length+' row'+(addedRows().length===1?'':'s')+' you added removed':'')+'.',ok:'Discard edits',danger:true}).then(ok=>{if(ok)revertAll()});
  }
}
function revertAll(){
  S.issues=null;
  [...S.edits.values()].forEach(e=>{const i=e.sh.colIdx[e.col];e.row.vals[i]=e.row.orig[i]});
  S.edits.clear(); S.pending=[];
  addedRows().forEach(({sh,row})=>removeRow(sh,row));
  [...S.metaEd.values()].forEach(e=>setMeta(e.sh,e.k,e.old,true)); S.metaEd.clear(); persist(); updateCounts(); applyAndRender(); if($('#changes').classList.contains('open')) renderChanges(); if(S.selIt) renderDetail();
}

nd the attributes currently shown, as a draw.io file to keep editing; re-exporting later does not keep edits made in draw.io. The diagram can be zoomed, copied as Mermaid source, or saved as .mmd, SVG or PNG; SVG and PNG use your arrangement.</p>`)}

  <p>The page opens on the <b>Overview</b>: how many tables, fields and lookups the model has, how complete the documentation is (fields and tables with a description, dictionary entries with an area and purpose), the least-described tables, a summary by area, and the latest changes and edits. Click a tile to jump to the detail.</p>

const isLookupType=t=>/lookup|customer|owner/i.test(t||'');
// workbook wording ("Whole Number", "Two Options") and Dataverse AttributeType ("Integer", "Boolean") put in the same buckets
function typeClass(t){
  const l=String(t||'').toLowerCase().replace(/[^a-z]/g,''); if(!l) return '';
  if(/lookup|customer|owner|regarding/.test(l)) return 'lookup';
  if(/uniqueidentifier|^guid/.test(l)) return 'id';
  if(/multiselect|multichoice/.test(l)) return 'multichoice';
  if(/picklist|choice|optionset|^state$|^status|statusreason/.test(l)) return 'choice';
  if(/twooptions|boolean|yesno/.test(l)) return 'bool';
  if(/date/.test(l)) return 'date';
  if(/money|currency/.test(l)) return 'money';
  if(/decimal|double|float/.test(l)) return 'decimal';
  if(/integer|wholenumber|bigint|^int/.test(l)) return 'int';
  if(/string|memo|text|multipleline|singleline|email|phone|url|ticker/.test(l)) return 'text';
  return ''; // Virtual, EntityName, PartyList, images and files: not compared
}
// "Business Required" in the maker portal is ApplicationRequired in the metadata
function reqClass(v){
  const k=String(v||'').toLowerCase().replace(/[^a-z]/g,'');
  if(k==='systemrequired') return 'system';
  if(k==='applicationrequired'||k==='businessrequired') return 'business';
  if(k==='recommended'||k==='businessrecommended') return 'recommended';
  if(k==='none'||k==='optional') return 'none';
  return '';
}
// your own publisher prefixes: those of the custom tables in the workbook, leaving out Microsoft's (ms…, adx)
// a lookup's relationship is only "known" when something records it: today, imported Dataverse metadata
// (an N:1 from this field to that table). Unknown ones are drawn as plain lines and flagged for review.
function relKnown(sh,row,target){if(relTypeOf(sh,row)==='N:1') return true; const ln=getVal(sh,row,'Logical Name').trim(); const de=S.dv&&sh&&S.dv.ents[sh.logical];return !!(de&&de.m1.some(r=>r.attr===String(ln).toLowerCase()&&(r.target===target||(r.target==='owner'&&(target==='systemuser'||target==='team')))))}
/* ---------- publishers and prefixes ---------- */
// Your publishers (prefix, unique name, display name, choice value prefix), and the prefixes that are Microsoft's or
// another vendor's (out of the box). Kept in this browser for every workbook. An entry ending in * matches any prefix
// starting with it (ms* covers msdyn, mspp, msdynce…). With no publishers saved, yours are guessed from the custom tables.
const MS_PREFIXES_DEFAULT=['ms*','adx'];

  const mine=ln=>own.size?(ln.includes('_')&&own.has(ln.split('_')[0])):true;

    (e.ManyToManyRelationships||[]).forEach(r=>{const a=lc(r.Entity1LogicalName),b=lc(r.Entity2LogicalName); pushU(t.nn,{schema:r.SchemaName,other:a===ln?b:a,intersect:r.IntersectEntityName||''})});

    try{await idb.put(rec)}catch(e){saveState(false,'This browser could not store the Dataverse metadata. It will be gone after a reload.')}

}

  if(/^(currency|money)$/.test(l)) return {act:'attr',t:'money',min:num('minimum value')??-922337203685477,max:num('maximum value')??922337203685477,acc:num('precision')??2};

// zipName and c are given for the script in a build zip; without them it is the general script from Export -> Import script
function importScript(zipName,c){
  const what=c?c.solName+' '+c.version:'a solution (.zip)';
  const pick=zipName?`  $SolutionPath = Join-Path $PSScriptRoot '${zipName}'`:`  # the one solution zip in this folder (build zips from the Data Model Explorer are left out)
  $zips = @(Get-ChildItem -Path $PSScriptRoot -Filter *.zip | Where-Object { $_.Name -notlike '* build.zip' })
  if ($zips.Count -ne 1) { throw "Found $($zips.Count) solution zips next to this script. Say which one with -SolutionPath." }
  $SolutionPath = $zips[0].FullName`;
  return `<#
  Imports ${what} into a Dataverse environment with the Power Platform CLI (pac).

  Usage:   .\\import.ps1 -EnvironmentUrl https://yourorg.crm11.dynamics.com
           .\\import.ps1 -EnvironmentUrl https://yourorg.crm11.dynamics.com -Check   # run Microsoft's solution checker first
           .\\import.ps1 -EnvironmentUrl https://yourorg.crm11.dynamics.com -SolutionPath .\\MySolution_1_0_0_0.zip
  ${zipName?'Without -SolutionPath it imports '+zipName+' from this folder.':'Without -SolutionPath it imports the one solution zip in this folder.'}

  If Windows refuses to run a downloaded script, run this once first:   Unblock-File .\\import.ps1

  Needs PowerShell 7 (or Windows PowerShell 5.1) and pac. If pac is missing, it is installed:
  with the .NET SDK when present (dotnet tool install), otherwise with winget on Windows.
  Your account needs the System Customizer or System Administrator role. Import into a development environment first.
#>
param(
  [Parameter(Mandatory = $true)][string]$EnvironmentUrl,
  [string]$SolutionPath,
  [switch]$Check
)
$ErrorActionPreference = 'Stop'
if (-not $SolutionPath) {
${pick}
}
if (-not (Test-Path $SolutionPath)) { throw "Solution file not found: $SolutionPath" }
$solution = (Resolve-Path $SolutionPath).Path
Write-Host "Solution: $solution"

function Test-Pac { [bool](Get-Command pac -ErrorAction SilentlyContinue) }
if (-not (Test-Pac)) {
  Write-Host 'The Power Platform CLI (pac) is not installed. Installing it...'
  if (Get-Command dotnet -ErrorAction SilentlyContinue) {
    dotnet tool install --global Microsoft.PowerApps.CLI.Tool
    $env:PATH += [IO.Path]::PathSeparator + (Join-Path $HOME '.dotnet/tools')
  } elseif (Get-Command winget -ErrorAction SilentlyContinue) {
    winget install --id Microsoft.PowerAppsCLI --exact --accept-source-agreements --accept-package-agreements
    $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
  } else {
    throw 'Install the Power Platform CLI first (https://aka.ms/PowerPlatformCLI), then run this script again.'
  }
  if (-not (Test-Pac)) { throw 'pac was installed but is not available in this window yet. Open a new PowerShell window and run the script again.' }
}

Write-Host "Signing in to $EnvironmentUrl (a browser window opens)..."
pac auth create --environment $EnvironmentUrl
if ($LASTEXITCODE -ne 0) { throw 'Sign-in failed.' }
pac env who

if ($Check) {
  pac solution check --path $solution --outputDirectory (Join-Path (Split-Path $solution) 'check-results')
}

Write-Host 'Importing (this can take a while for a large model)...'
pac solution import --path $solution --publish-changes --async --max-async-wait-time 120
if ($LASTEXITCODE -ne 0) { throw 'The import failed. The messages above say why; nothing was changed.' }

Write-Host ''
Write-Host 'Imported. Next:'
Write-Host '  1. Create the fields in calculated-and-rollup-fields.xlsx by hand (if that file is here).'
Write-Host '  2. Check build-report.csv for anything marked "Not included".'
Write-Host '  3. Run the Dataverse check in the Data Model Explorer against this environment.'
`;
}
async function generateSolution(cfg){
  const plan=buildPlan(cfg); if(!plan.newTables.length&&!plan.shells.length&&!plan.nn.length) return toast('Nothing to build: no tables or fields with the prefix "'+cfg.prefix+'_"');
  const files=solutionFiles(plan), inner=new JSZip(); Object.entries(files).forEach(([n,t])=>inner.file(n,t));
  const ver=cfg.version.replace(/\./g,'_'), innerName=cfg.solName+'_'+ver+'.zip';
  const innerBytes=await inner.generateAsync({type:'uint8array',compression:'DEFLATE'});
  const outer=new JSZip(); outer.file(innerName,innerBytes); outer.file('import.ps1',importScript(innerName,cfg).replace(/\r?\n/g,'\r\n'));
  outer.file('build-report.csv',csv([['Table','Item','What','Action','Detail']].concat(plan.report.map(r=>[r.tbl,r.item,r.what,r.action,r.why]))));
  const mb=plan.tablesOnly?null:await manualWorkbook(); if(mb) outer.file('calculated-and-rollup-fields.xlsx',mb);
  const notIn=plan.report.filter(r=>r.action==='Not included').length, hand=plan.report.filter(r=>r.action==='Build by hand').length;
  outer.file('README.txt',[cfg.solDisplay+' ('+cfg.solName+' '+cfg.version+'), generated '+new Date().toLocaleString()+' from '+S.fileName,'',
    'Contents','  '+innerName+'  the unmanaged solution to import','  import.ps1  signs in with pac and imports it (installs pac if needed)','  build-report.csv  everything included, not included, or to build by hand, and why',(mb?'  calculated-and-rollup-fields.xlsx  fields to create by hand after the import':''),'',
    'What is in the solution',(plan.tablesOnly?'  Tables only: each new table with its primary name column. '+plan.counts.left+' fields and relationships were left out (see build-report.csv).':null),'  '+plan.newTables.length+' new tables, '+plan.shells.length+' existing tables gaining fields, '+plan.fieldCount+' fields, '+plan.rels.length+' one-to-many and '+plan.nn.length+' many-to-many relationships.','  '+plan.counts.auto+' fields are created by Dataverse itself and are not listed. '+notIn+' items are not included and '+hand+' are to build by hand (see build-report.csv).','',
    'Publisher: '+cfg.pubDisplay+' ('+cfg.pubName+'), prefix '+cfg.prefix+', choice value prefix '+cfg.optPrefix+'. If the environment already has this publisher, its unique name must match.','',
    'To import:  .\\import.ps1 -EnvironmentUrl https://yourorg.crm11.dynamics.com','Import into a development environment first. Then export the solution from there as managed for test and production.'].filter(l=>l!==undefined&&l!==null).join('\r\n'));
  const out=await outer.generateAsync({type:'blob',compression:'DEFLATE'});
  download(cfg.solName+'_'+ver+' build.zip',out);
  toast(plan.tablesOnly?'Solution built: '+plan.newTables.length+' new tables, each with its primary name column'+(notIn?' · '+notIn+' not included (see the report)':''):'Solution built: '+plan.newTables.length+' new tables, '+plan.fieldCount+' fields, '+(plan.rels.length+plan.nn.length)+' relationships'+(notIn?' · '+notIn+' not included (see the report)':''));
  return plan;
}

const SYS_TABLES=new Set(['systemuser','team','businessunit','transactioncurrency','organization','owner','calendar','queue','equipment','role']);
const mid=s=>String(s||'').replace(/[^A-Za-z0-9_]/g,'_').replace(/^(\d)/,'_$1')||'x';
const mq=s=>String(s||'').replace(/["\n\r]/g,' ').replace(/\s+/g,' ').trim();
function lookupTargetsOf(sh,row){
  if(sh.colIdx['Additional data']===undefined) return [];
  return targetsFromText(getVal(sh,row,'Additional data'));
}
// the lookup targets listed in an Additional data cell ("Targets:" followed by logical names), lower-cased
function targetsFromText(text){
  const out=[]; let inT=false;
  String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l.match(/^targets?\s*:\s*(.*)$/i);
    if(m){inT=true;m[1].split(/[,;]/).forEach(x=>{x=x.trim();if(x)out.push(x.toLowerCase())});return}
    if(/^[A-Za-z][A-Za-z ]*:/.test(l)){inT=false;return}
    if(inT) out.push(l.toLowerCase());
  });
  return out;
}
function mtype(t){
  const l=String(t||'').toLowerCase();
  if(/lookup|owner|customer|uniqueidentifier/.test(l)) return 'uuid';
  if(/two options|boolean|bool|yes\/no/.test(l)) return 'boolean';

function erdRelIndex(){

    if(isNNRow(s,row)){const tg=lookupTargetsOf(s,row)[0]; if(!tg) return; const k='n:'+ln.toLowerCase(); add(s.logical,{k,txt:dn,other:lbl(tg),dir:'nn'}); add(tg,{k,txt:dn,other:s.label,dir:'nn'}); return}

      const nb=u8ToB64(u);
      // which project's edits apply to this file? A file seen before keeps its own; a new file with edits open asks
      const known=S.lib.find(r=>r.b64===nb&&r.proj);
      let proj;
      if(known) proj=known.proj;
      else if(!cv&&(S.edits.size||S.pending.length)){
        const n=S.edits.size+S.pending.length;
        const carry=await dlg({title:'Carry your edits over?',body:'You have '+n+' edit'+(n===1?'':'s')+' on <b>'+esc(prevName)+'</b>.<br><br>If <b>'+esc(fname)+'</b> is a <b>newer version of the same data model</b>, your edits are re-applied to it, and any that clash with a changed value are listed for you to check.<br><br>If it is a <b>different workbook</b>, it opens with no edits, and your edits stay with '+esc(prevName)+'.',ok:'Newer version: carry edits over',cancel:'Different workbook'});
        proj=carry?S.proj:newProj();
      } else proj=newProj();
      // a converted export is a new starting point: there is nothing meaningful to compare it with
      saveVersions(fresh?null:{name:prevName,b64:prevB64,proj:S.proj},{name:fname,b64:nb,proj});
      S.curB64=nb; S.prevB64=fresh?null:prevB64; S.handle=handle||null; S.proj=proj; S.restored=false;
      libAdd(fname,nb,{sheets:shs.length,tables:shs.filter(s=>s.kind==='entity').length},handle,proj);
      init(wb,fname,{prevSheets:fresh?null:prevSheets,prevName:prevName,announce:true});
    }catch(err){dlg({title:'Could not read that file',body:esc(err.message),ok:'OK',cancel:null,danger:true})}
  };
  r.readAsArrayBuffer(f);
}
(async()=>{try{
  {const tm=store.get('dme.tmpl');try{if(tm)loadTemplate(tm.b64,tm.name);else loadTemplate(TEMPLATE_B64,TEMPLATE_NAME)}catch(e){loadTemplate(TEMPLATE_B64,TEMPLATE_NAME)}}
  let cur=null, prev=null; try{cur=await idb.get('__cur');prev=await idb.get('__prev')}catch(e){}
  if(!cur){cur=store.get('dme.cur');prev=store.get('dme.prev')}
  const b64=cur?cur.b64:EMBEDDED_B64, name=cur?cur.name:EMBEDDED_NAME;
  S.curB64=b64; S.prevB64=(cur&&prev)?prev.b64:null;
  S.restored=!!cur&&b64!==EMBEDDED_B64;   // reopened from this browser: the Overview says so
  S.proj=cur?(cur.proj||'legacy'):'bundled';
  // one-off move: edits saved by the earlier version (one shared list) go to the workbook that was open then
  {const old=store.get(EDIT_STORE_OLD); if(old&&old.length&&!storedEdits(S.proj).length&&store.set(editKey(S.proj),old)) store.del(EDIT_STORE_OLD)}
  let prevSheets=null,prevName='';
  if(cur&&prev){try{prevSheets=parseWorkbook(XLSX.read(b64ToU8(prev.b64),{type:'array'}));prevName=prev.name}catch(e){}}
  init(XLSX.read(b64ToU8(b64),{type:'array'}),name,{prevSheets,prevName});
  wireFiles(); libLoad();
}catch(err){
  $('#loading').innerHTML='<div>Open a workbook to begin (drag an .xlsx here)<br><br><button class="btn primary" onclick="document.getElementById(\'file\').click()">Open file…</button><br><small>'+esc(err.message)+'</small></div>';
}})();
})();
</script>
